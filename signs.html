<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Words | Signsational</title>
  <link rel="icon" type="image/svg+xml" href="assets/mochi-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/signs.css">
  <link rel="stylesheet" href="css/dark.css">
  <script src="js/theme.js"></script>
</head>
<body class="garden-bg">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Signsational, learn ASL. Home"><svg class="brand-mark" viewBox="0 0 200 160" aria-hidden="true" focusable="false"><g class="brand-confetti"><circle cx="30" cy="42" r="14" fill="#FFD23F"/><circle cx="172" cy="36" r="18" fill="#FF6FAE"/><circle cx="186" cy="98" r="9" fill="#CDB4F5"/><path d="M20 96Q21.8 104.2 30 106Q21.8 107.8 20 116Q18.2 107.8 10 106Q18.2 104.2 20 96zM126 7Q127.26 12.74 133 14Q127.26 15.26 126 21Q124.74 15.26 119 14Q124.74 12.74 126 7z" fill="#CDB4F5"/></g><g transform="translate(10 18)"><g class="brand-mochi"><path class="brand-body" d="M90 32C132 32 156 64 156 94C156 118 128 130 90 130C52 130 24 118 24 94C24 64 48 32 90 32z"/><path d="M90 33C86 22 76 17 66 19C70 29 80 34 90 33zM90 33C96 20 108 16 118 20C112 31 102 35 90 33z" fill="#2FA87A" stroke="#2B1B4A" stroke-width="5" stroke-linejoin="round"/><circle cx="70" cy="88" r="7" fill="#2B1B4A"/><circle cx="110" cy="88" r="7" fill="#2B1B4A"/><path d="M82 100q4 5.5 8 0q4 5.5 8 0" fill="none" stroke="#2B1B4A" stroke-width="5" stroke-linecap="round"/></g></g></svg><span class="brand-text" aria-hidden="true"><span class="brand-name">Signsational</span><span class="brand-tag">Learn ASL</span></span></a>
    <div class="topbar-right">
      <span class="coins" title="Coins earned">
        <img class="coin-icon" src="assets/coin.png" alt="" aria-hidden="true"> <b id="coinDisplay">0</b>
      </span>
      <span class="streak" title="Days practiced in a row">
        <span aria-hidden="true">🔥</span> <b id="streakCount">0</b> <span class="streak-label">day streak</span>
      </span>
      <button class="btn btn-quiet theme-btn" id="themeBtn" type="button" aria-label="Dark mode" aria-pressed="false"><svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="#CDB4F5" stroke="#2B1B4A" stroke-width="1.8" stroke-linejoin="round"/><circle cx="18" cy="5" r="1.2" fill="#FFD23F"/></svg><svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#FFD23F" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g><circle cx="12" cy="12" r="4.6" fill="#FFD23F" stroke="#2B1B4A" stroke-width="1.6"/></svg></button>
    </div>
  </header>

  <main id="main">
    <section class="screen">
      <div class="play-top">
        <a class="btn btn-quiet" href="index.html#signWordsTitle">Back to home</a>
        <p class="play-meta">Sign Words, <span id="wordCount"></span></p>
      </div>

      <div class="play-grid">
        <div class="cam">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>
          <p class="cam-status" id="camStatus" role="status"></p>
        </div>

        <div class="panel">
          <div class="target" id="target">
            <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring-bg" cx="60" cy="60" r="54"/>
              <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="54"/>
            </svg>
            <span class="target-letter target-emoji" id="targetEmoji" aria-hidden="true"></span>
          </div>
          <h1 class="sign-name" id="signName" aria-live="polite"></h1>
          <p class="hint" id="hint"></p>
          <figure class="sign-demo" id="signDemo" hidden>
            <video id="demoVideo" autoplay muted loop playsinline aria-label="Video of a person signing this word"></video>
            <figcaption><a class="sign-video" id="signVideo" target="_blank" rel="noopener">Watch on SignASL.org</a></figcaption>
          </figure>
          <p class="seeing" id="seeing"></p>
          <div class="coach">
            <div class="mascot-stage small" data-mascot id="playMascot"></div>
            <p class="bubble" id="playBubble" aria-live="polite"></p>
          </div>
          <button class="btn btn-quiet" id="skipBtn" type="button">Next sign</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="celebrate" class="celebrate" aria-labelledby="celebrateTitle">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <p class="big-sticker" id="bigSticker" aria-hidden="true"></p>
    <h2 id="celebrateTitle"></h2>
    <p id="celebrateText"></p>
    <p class="coin-reward" id="coinReward"></p>
    <div class="dialog-actions">
      <button class="btn" id="nextBtn" type="button">Next sign</button>
      <a class="btn btn-quiet" href="index.html#signWordsTitle">Back to home</a>
    </div>
  </dialog>

  <script type="module" src="js/flavor-menu.js"></script>
  <script type="module" src="js/signs-game.js"></script>
</body>
</html>
